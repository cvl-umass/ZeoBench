pretrained_feature_extractor: null
finetune: true
img_side: 64
accumulate_grad_batches: 1
max_epochs: 50
default_root_dir: null
accelerator: gpu
strategy: ddp
devices: 1
num_nodes: 1
precision: 16-mixed
sync_batchnorm: true
benchmark: true
performance:
  disable_channel_last: false
checkpoint:
  enabled: true
  dir: checkpoints
  frequency: 1
  monitor: val_loss
  mode: min
  save_top_k: 1
  save_last: true
auto_resume:
  enabled: true
  max_hours: 10000
wandb:
  enabled: false
  entity: null
  project: zeolites-linear-probe
  offline: false
data:
  task: regression
  num_classes: 1
  subset_size: 750
  dataset_kwargs:
    custom_train_file: /path/to/subsets/train_subset_${data.dataset_kwargs.target}_${data.subset_size}.txt
    target: 2C17
    full: false
  dataset: zeolites
  train_path: /path/to/dataset/zeolites
  val_path: /path/to/dataset/zeolites
  format: h5
  no_labels: false
  fraction: 1.0
  num_workers: 16
optimizer:
  lr: 0.001
  batch_size: 128
  name: adamw
  weight_decay: 0.01
  classifier_lr: 0.01
  kwargs:
    betas:
    - 0.9
    - 0.999
scheduler:
  warmup_epochs: 5
  max_epochs: 50
  name: warmup_cosine
  warmup_start_lr: 0.0
train_transform:
  _target_: solo.data.custom_transforms.ZeoAugmentation
  crop_size: ${img_side}
  grid_resolution: 0.45
  rotate: true
  translate: true
val_transform:
  _target_: solo.data.custom_transforms.ZeoValidationTransform
  crop_size: ${img_side}
  grid_resolution: 0.45
backbone:
  _target_: solo.backbones.resnet.resnet18_3d
  kwargs:
    in_channels: 1
    spatial_dims: 3
    conv1_t_stride: 2
    no_max_pool: true
