name: linear
task: regression
cache_features: false
debug: false
resume_from_checkpoint: null
default_root_dir: null
pretrained_feature_extractor: /path/to/checkpoints/simclr_resnet/simclr_resnet_sweep-long-lr-optimizer.classifier_lr-bs-sigma/lr-1e0_optimizer.classifier_lr-1e-3_bs-512_sigma-0.3/simclr-resnet18-3d-zeolites-0-ep=399.ckpt
finetune: true
img_side: 64
accumulate_grad_batches: 1
max_epochs: 50
accelerator: gpu
strategy: ddp_find_unused_parameters_false
devices: 1
precision: 16-mixed
sync_batchnorm: true
benchmark: true
num_nodes: 1
spatial_probe: false
performance:
  disable_channel_last: false
checkpoint:
  enabled: true
  dir: checkpoints
  frequency: 1
  monitor: val_loss
  mode: min
  save_top_k: 1
  save_last: true
auto_resume:
  enabled: true
  max_hours: 10000
wandb:
  enabled: false
  entity: null
  project: zeolites-linear-probe
  offline: false
data:
  task: regression
  num_classes: 1
  dataset_kwargs:
    annotations_folder: CH4-adsorption
    annotations_file: hmof_CH4_0.05bar.csv
    target_column: adsorption
    distance_folder: distance-grids-h5
    train_file: train_set.txt
    val_file: val_set.txt
    test_file: test_set.txt
  dataset: mofs
  train_path: /path/to/ML-MOFs
  val_path: /path/to/ML-MOFs
  format: h5
  no_labels: false
  fraction: 1.0
  num_workers: 16
optimizer:
  lr: 0.01
  batch_size: 128
  name: adamw
  weight_decay: 0.01
  classifier_lr: 0.01
  kwargs:
    betas:
    - 0.9
    - 0.999
scheduler:
  warmup_epochs: 5
  max_epochs: 50
  name: warmup_cosine
  warmup_start_lr: 0.0
train_transform:
  _target_: solo.data.custom_transforms.ZeoAugmentation
  crop_size: ${img_side}
  grid_resolution: 0.45
  rotate: true
  translate: true
  vector_reference_resolution: 0.45
val_transform:
  _target_: solo.data.custom_transforms.ZeoValidationTransform
  crop_size: ${img_side}
  grid_resolution: 0.45
  vector_reference_resolution: 0.45
backbone:
  _target_: solo.backbones.resnet.resnet18_3d
  kwargs:
    in_channels: 1
    spatial_dims: 3
    conv1_t_stride: 2
    no_max_pool: true
