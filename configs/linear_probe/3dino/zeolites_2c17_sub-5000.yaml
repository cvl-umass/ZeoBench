name: linear
task: regression
cache_features: true
debug: false
resume_from_checkpoint: null
default_root_dir: null
pretrained_feature_extractor: ../../out/precompute/3dino/offline_features.pt
finetune: false
img_side: 112
accumulate_grad_batches: 1
max_epochs: 100
accelerator: gpu
strategy: ddp_find_unused_parameters_false
devices: 1
precision: 16-mixed
sync_batchnorm: true
benchmark: true
num_nodes: 1
spatial_probe: false
performance:
  disable_channel_last: true
checkpoint:
  enabled: true
  dir: checkpoints
  frequency: 1
  monitor: val_loss
  mode: min
  save_top_k: 1
  save_last: true
auto_resume:
  enabled: true
  max_hours: 10000
wandb:
  enabled: false
  entity: null
  project: zeolites-linear-probe
  offline: false
data:
  task: regression
  num_classes: 1
  subset_size: 5000
  dataset_kwargs:
    custom_train_file: /path/to/subsets/train_subset_${data.dataset_kwargs.target}_${data.subset_size}.txt
    target: 2C17
    full: false
  dataset: zeolites
  train_path: /path/to/dataset/zeolites
  val_path: /path/to/dataset/zeolites
  format: h5
  no_labels: false
  fraction: 1.0
  num_workers: 4
optimizer:
  lr: 0.1
  batch_size: 128
  name: adamw
  weight_decay: 0.01
  classifier_lr: 0.01
  kwargs:
    betas:
    - 0.9
    - 0.999
scheduler:
  warmup_epochs: 10
  max_epochs: 100
  name: warmup_cosine
  warmup_start_lr: 0.0
train_transform:
  _target_: solo.data.custom_transforms.ZeoAugmentation
  crop_size: ${img_side}
  grid_resolution: 0.45
  rotate: true
  translate: true
val_transform: ${augmentations}
backbone:
  _target_: solo.backbones.custom.vit_3dino.vit_3dino
  pretrained_weights: /path/to/workspace-zeo/resnet/3DINO-main/3DINO-ViT/3dino_vit_weights.pth
  config_file: train/vit3d_highres
augmentations:
  _target_: torchvision.transforms.Compose
  transforms:
  - _target_: solo.data.custom_transforms.ZeoValidationTransform
    crop_size: ${img_side}
    grid_resolution: 0.45
  - _target_: solo.data.custom_transforms.QuantileNormalize3DINO
